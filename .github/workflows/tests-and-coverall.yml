# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Taiga Back - Test and Upgrade Check
on:
  push:
    branches: [ main, 'django6-*' ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Django 6.1 supports Python 3.12-3.15 and PostgreSQL 15+
        include:
          - { python-version: '3.12', postgres: '15' }
          - { python-version: '3.13', postgres: '17' }
          - { python-version: '3.14', postgres: '18' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taiga
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: '--health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 6 --health-start-period 20s'
      rabbitmq:
        image: rabbitmq
        ports:
          - 5672:5672
        # needed because the rabbitmq container does not provide a healthcheck
        options: '--health-cmd "rabbitmqctl status" --health-interval 5s --health-timeout 5s --health-retries 6 --health-start-period 20s'

    name: Test on Python ${{ matrix.python-version }} / PostgreSQL ${{ matrix.postgres }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt -r requirements-devel.txt

    - name: Test with pytest and calculate coverage
      run: |
        coverage run --source=taiga --omit='*tests*,*commands*,*migrations*,*admin*,*.jinja,*dashboard*,*settings*,*wsgi*,*questions*,*documents*' -m pytest -v --tb=native --pythonwarnings=default
        coverage report --skip-empty

  upgrade-check:
    # Release gate: a database built by the original upstream code must upgrade in place.
    runs-on: ubuntu-latest
    name: Upgrade over a database created by upstream Taiga 6.x
    env:
      # upstream commit the fork started from; the reference database is built with this code
      ORIG_REF: c8264ac67751
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch upstream history
      run: |
        git remote add upstream https://github.com/taigaio/taiga-back.git
        git fetch --quiet upstream main
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt -r requirements-devel.txt
    - name: Build the reference database with the original code
      run: scripts/upgrade-check/build_reference_db.sh "$RUNNER_TEMP/taiga-ref"
    - name: Upgrade it with this fork and compare
      run: PYTHON=python scripts/upgrade-check/run_upgrade_check.sh "$RUNNER_TEMP/taiga-ref"
